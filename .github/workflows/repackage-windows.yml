name: Repackage Windows releases
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: windows-release-repackaging
jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        version: ['1.6.0', '1.0.0', '1.1.0', '1.2.0', '1.2.1', '1.3.0', '1.4.0', '1.5.0', '1.5.1']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Combine ZIP volumes and publish the portable build
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ matrix.version }}
        run: bash packaging/repackage-portable.sh
  setup:
    needs: portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build, verify, and publish Windows Setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: '1.6.0'
        run: ./packaging/repackage-setup.ps1
